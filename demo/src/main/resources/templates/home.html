<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZ Ride | Vibe ke sath Travel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Thoda extra glow effect ke liye */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
            psuedo
        </div>
       <div class="flex items-center gap-4">
    
    <div sec:authorize="!isAuthenticated()">
        <a href="/login" class="px-4 py-2 hover:text-purple-400 transition">Login</a>
        <a href="/signup" class="px-5 py-2 bg-purple-600 hover:bg-purple-700 rounded-full font-medium transition ml-2">Sign Up</a>
    </div>

    <div sec:authorize="isAuthenticated()" class="flex items-center gap-4">
        <a href="/notifications" class="relative text-slate-300 hover:text-white transition">
            <span class="text-2xl">🔔</span>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-slate-900"></span>
        </a>

        <a href="/offer-ride" class="text-emerald-400 hover:text-emerald-300 font-medium transition flex items-center gap-1">
            <span class="text-xl">+</span> Publish
        </a>

        <a href="/profile" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full border border-slate-700 transition">
            <span class="w-6 h-6 bg-purple-500 rounded-full flex items-center justify-center text-xs">👤</span>
            <span class="font-medium" sec:authentication="name">User</span>
        </a>
    </div>

</div>
    </nav>

    <div class="flex flex-col items-center justify-center h-[80vh] text-center px-4">
        
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight">
            Travel karo, <br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Vibe check karke.
            </span>
        </h1>
        
        <p class="text-slate-400 text-lg md:text-xl max-w-2xl mb-10">
            Sasti rides, naye dost aur poora safety check. 
            Bas destination daalo aur nikal pado.
        </p>

        <form action="/rides/search"  class="glass-card p-4 rounded-2xl flex flex-col md:flex-row gap-4 w-full max-w-3xl shadow-2xl shadow-purple-900/20">
            <input type="text" name="source" placeholder="Leaving from..." class="bg-slate-800/50 p-4 rounded-xl outline-none text-white w-full focus:ring-2 focus:ring-purple-500 transition">
            <input type="text" name="destination" placeholder="Going to..." class="bg-slate-800/50 p-4 rounded-xl outline-none text-white w-full focus:ring-2 focus:ring-purple-500 transition">
            <input type="date" class="bg-slate-800/50 p-4 rounded-xl outline-none text-white w-full md:w-auto focus:ring-2 focus:ring-purple-500 transition">
            
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-8 rounded-xl transition transform hover:scale-105 w-full md:w-auto">
                Search
            </button>
        </form>

    </div>

</body>
</html>
