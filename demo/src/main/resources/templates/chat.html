<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Scrollbar ko thoda sunder banate hain */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">

    <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-3">
            <a href="/" class="text-slate-400 hover:text-white text-xl">←</a>
            <div>
                <h2 class="font-bold text-lg">Chat with <span class="text-purple-400" th:text="${otherUser.name}">Raju</span></h2>
                <p class="text-xs text-slate-500">Online</p>
            </div>
        </div>
    </div>

    <div id="messageBox" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900">
        <div class="text-center text-slate-600 text-sm mt-10">Loading chats...</div>
    </div>

    <div class="p-4 bg-slate-800 border-t border-slate-700">
        <form id="chatForm" class="flex gap-2 max-w-4xl mx-auto">
            <input type="text" id="messageInput" class="flex-1 bg-slate-700 text-white rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white rounded-full px-6 py-2 font-bold transition transform active:scale-95">
                Send ➤
            </button>
        </form>
    </div>

    <input type="hidden" id="otherUserId" th:value="${otherUser.id}">

    <script>
        const otherUserId = document.getElementById('otherUserId').value;
        const messageBox = document.getElementById('messageBox');
        let lastMessageCount = 0;

        // 1. Load Messages Function
        async function loadMessages() {
            try {
                const response = await fetch(`/api/messages/history?otherUserId=${otherUserId}`);
                const messages = await response.json();

                // Agar naye messages aaye hain, tabhi update karo
                if (messages.length > lastMessageCount) {
                    messageBox.innerHTML = ''; // Box clear karo
                    
                    messages.forEach(msg => {
                        // Check karo message kisne bheja (Me vs Other)
                        // Note: Ye logic thoda simple rakha hai. 
                        // Ideal way: Check loggedInUserId vs msg.sender.id
                        // Lekin frontend pe loggedInUserId lana padega.
                        // Jugad: Hum CSS class message content ke hisab se laga rahe hain abhi ke liye
                        
                        // Backend se aaya msg object: { sender: {id: 1, name: "Raju"}, content: "Hi" }
                        // Is logic ko perfect karne ke liye hum maan lete hain ki 'right' side wale hum hain
                        // Lekin abhi ke liye hum simple list dikhate hain.
                        
                        // Better approach for display:
                        const div = document.createElement('div');
                        // Styling abhi generic rakhte hain (Driver/User name dikhayenge)
                        div.className = "flex flex-col bg-slate-800 p-3 rounded-xl max-w-xs";
                        
                        div.innerHTML = `
                            <span class="text-xs text-purple-400 font-bold mb-1">${msg.sender.name}</span>
                            <span class="text-sm">${msg.content}</span>
                        `;
                        messageBox.appendChild(div);
                    });

                    // Scroll to bottom
                    messageBox.scrollTop = messageBox.scrollHeight;
                    lastMessageCount = messages.length;
                }
            } catch (error) {
                console.error("Chat load error:", error);
            }
        }

        // 2. Send Message Function
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const content = input.value;

            if(!content) return;

            try {
                await fetch(`/api/messages/send?receiverId=${otherUserId}&content=${content}`, {
                    method: 'POST'
                });
                input.value = ''; // Input clear
                loadMessages(); // Turant naya message dikhao
            } catch (error) {
                alert("Message failed!");
            }
        });

        // 3. Auto Refresh (Polling) - Har 2 second me check karo
        setInterval(loadMessages, 2000);
        
        // Initial load
        loadMessages();
    </script>
</body>
</html>
