<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications | GenZ Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-2xl mx-auto mt-10">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Notifications 🔔</h1>
            <a href="/" class="text-slate-400 hover:text-white">Back to Home</a>
        </div>

        <div th:if="${notifications.empty}" class="bg-slate-800 p-8 rounded-2xl text-center text-slate-400">
            <p class="text-xl">Sab shant hai... 🦗</p>
            <p class="text-sm mt-2">Abhi tak kisi ne apki ride book nahi ki.</p>
        </div>

        <div class="space-y-4">
            <div th:each="booking : ${notifications}" class="bg-slate-800 p-4 rounded-xl border-l-4 border-purple-500 flex items-center gap-4 shadow-lg hover:bg-slate-700 transition">
                
                <div class="bg-purple-600/20 text-purple-400 w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold">
                    👤
                </div>

                <div class="flex-1">
                    <p class="font-medium">
                        <span class="text-purple-400 font-bold" th:text="${booking.passenger.name}">User</span> 
                        booked your ride! 🎉
                    </p>
                    <p class="text-sm text-slate-400">
                        <span th:text="${booking.ride.source}">Delhi</span> ➝ 
                        <span th:text="${booking.ride.destination}">Mumbai</span>
                    </p>
                    <p class="text-xs text-slate-500 mt-1" th:text="${booking.bookingTime}">2026-01-07</p>
                </div>

                <a th:href="@{/chat(withUserId=${booking.passenger.id})}" class="bg-slate-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm">
                    Chat 💬
                </a>
            </div>
        </div>
    </div>

</body>
</html>
