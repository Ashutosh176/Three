    <body class="bg-slate-900 text-white font-sans flex items-center justify-center h-screen">

    <div class="glass-card p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold text-center mb-6 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
            Join the Squad 🚀
        </h2>

        <form action="/signup" method="post" class="space-y-4">
            
            <div>
                <label class="block text-sm text-slate-400 mb-1">Full Name</label>
                <input type="text" name="name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-purple-500 transition" placeholder="Your Name" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Email Address</label>
                <input type="email" name="email" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-purple-500 transition" placeholder="you@example.com" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Phone Number</label>
                <input type="text" name="phoneNumber" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-purple-500 transition" placeholder="9876543210">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                <input type="password" name="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-purple-500 transition" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 rounded-lg transition transform hover:scale-105 mt-4">
                Create Account
            </button>
        </form>

        <p class="text-center text-slate-500 mt-4 text-sm">
            Already have an account? <a href="/login" class="text-purple-400 hover:underline">Log in</a>
        </p>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Page refresh hone se roko

            // 1. Form se data uthao
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phoneNumber: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: "PASSENGER" // Default role
            };

            try {
                // 2. Java Backend ko bhejo
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                // 3. Response check karo
                if (response.ok) {
                    alert("Account Ban Gaya Bhai! 🎉");
                    window.location.href = "/"; // Home page par bhejo
                } else {
                    alert("Kuch gadbad hai (Shayad email pehle se hai?)");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Server connect nahi ho raha!");
            }
        });
    </script>

</body>
