<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile | GenZ Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-2xl mx-auto mt-10">
        <div class="bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700 text-center relative overflow-hidden">
            
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-purple-600 to-pink-600 opacity-50 blur-3xl -z-10"></div>

            <div class="w-24 h-24 bg-slate-700 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 border-4 border-slate-900 shadow-xl">
                👤
            </div>

            <h1 class="text-3xl font-bold text-white mb-1" th:text="${user.name}">User Name</h1>
            <p class="text-purple-400 text-sm mb-6" th:text="${user.email}">user@example.com</p>

            <div class="grid grid-cols-2 gap-4 mb-8 text-left">
                <div class="bg-slate-900/50 p-4 rounded-xl">
                    <p class="text-xs text-slate-500 uppercase">Phone</p>
                    <p class="font-medium" th:text="${user.phoneNumber}">-</p>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-xl">
                    <p class="text-xs text-slate-500 uppercase">Role</p>
                    <p class="font-medium" th:text="${user.role}">USER</p>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <a href="/my-rides" class="block w-full text-center bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-bold transition mb-3 cursor-pointer">
    My Rides & Bookings 🚗
</a>
                
                <a href="/logout" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 py-3 rounded-xl font-bold transition border border-red-500/20">
                    Logout
                </a>
            </div>
        </div>

        <div class="text-center mt-8">
            <a href="/" class="text-slate-400 hover:text-white underline">Back to Home</a>
        </div>
    </div>

</body>
</html>
