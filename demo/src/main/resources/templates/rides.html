<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Rides | GenZ Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans p-6">

    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-8 text-center">Available Rides 🚗</h2>
        <div class="flex gap-4 justify-center mb-6">
            <span class="text-slate-400 py-2">Sort by:</span>
            
            <a th:href="@{/rides/search(source=${source}, destination=${destination}, filter='cheapest')}" 
               class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-full text-sm transition">
               💰 Cheapest
            </a>
            
            <a th:href="@{/rides/search(source=${source}, destination=${destination}, filter='earliest')}" 
               class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-full text-sm transition">
               ⏰ Earliest
            </a>
            
            <a th:href="@{/rides/search(source=${source}, destination=${destination})}" 
               class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-full text-sm transition">
               🔄 Reset
            </a>
        </div>

        <div th:if="${ridesList.empty}" class="text-center text-slate-500 text-xl mt-10">
            Koi ride nahi mili bhai. Khud ki car le jao! 😢
        </div>

        <div class="grid gap-6">
            <div th:each="ride : ${ridesList}" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 hover:border-purple-500 transition shadow-lg flex justify-between items-center">
                
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-2xl font-bold text-emerald-400" th:text="${ride.source}">Delhi</span>
                        <span class="text-slate-500">➜</span>
                        <span class="text-2xl font-bold text-emerald-400" th:text="${ride.destination}">Mumbai</span>
                    </div>
                    <div class="text-slate-400 text-sm">
                        Date: <span th:text="${ride.travelDate}">2025-01-01</span>
                    </div>
                    <div class="text-slate-400 text-sm mt-1">
                        Driver: <span class="text-purple-400 font-medium" th:text="${ride.driver.name}">Raju</span>
                    </div>
                </div>

                <div class="text-right">
                    <div class="text-3xl font-bold text-white mb-2">
                        ₹<span th:text="${ride.price}">500</span>
                    </div>


<a th:href="@{/ride/track(rideId=${ride.id})}" 
   class="text-cyan-400 hover:text-white border border-cyan-400 hover:bg-cyan-600 px-3 py-2 rounded-xl font-medium transition text-sm mr-2"
   title="View on Map">
    🗺️ Route
</a>

    
                    <a th:href="@{/chat(withUserId=${ride.driver.id})}" 
   class="text-purple-400 hover:text-white border border-purple-400 hover:bg-purple-600 px-4 py-2 rounded-xl font-medium transition text-sm mr-2">
    Chat 💬
</a>


<form action="/api/bookings/book" method="post" style="margin-top: 10px;">
    
    <input type="hidden" name="rideId" th:value="${ride.id}" />
    
    <button type="submit" class="book-btn">
        Book Now ⚡
    </button>
</form>

<script>
    async function bookRide(rideId) {
        // NOTE: Abhi hum Passenger ID 2 hardcode kar rahe hain. 
        // Agle step (Security) me ye automatic hoga.
    

        if(confirm("Kya aap ye ride book karna chahte hain?")) {
            try {
                const response = await fetch(`/api/bookings/book?rideId=${rideId}&passengerId=${passengerId}`, {
                    method: 'POST'
                });
                
                const message = await response.text();
                
                if (response.ok) {
                    alert("Success: " + message + " 🎉");
                    window.location.reload(); // Page refresh karo taaki seat kam dikhe
                } else {
                    alert("Error: " + message + " 😢");
                }
            } catch (error) {
                console.error(error);
                alert("Server Error");
            }
        }
    }
</script>
                </div>

            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-slate-400 hover:text-white underline">Back to Home</a>
        </div>
    </div>

</body>
</html>
